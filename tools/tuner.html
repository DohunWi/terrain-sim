<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>terrain-sim erosion tuner</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14171c;
    --panel: #1c2028;
    --border: #2b3038;
    --text: #e6e8eb;
    --muted: #8a919c;
    --accent: #5fb3a3;
    --bad: #d9765a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: 320px 1fr;
    min-height: 100vh;
  }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
  }
  main {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 { font-size: 15px; margin: 0 0 16px; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
  .sim-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .sim-tabs button {
    flex: 1;
    padding: 8px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .sim-tabs button.active { background: var(--accent); color: #10231f; border-color: var(--accent); font-weight: 600; }
  .reset-btn {
    width: 100%;
    padding: 8px;
    margin-bottom: 18px;
    background: transparent;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .reset-btn:hover { color: var(--text); border-color: var(--muted); }
  .field { margin-bottom: 14px; }
  .field label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field output { color: var(--text); font-variant-numeric: tabular-nums; }
  .field input[type=range] { width: 100%; accent-color: var(--accent); }
  .field.shared { border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 18px; }
  .images {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .images figure { margin: 0; }
  .images img {
    width: 100%;
    image-rendering: pixelated;
    border: 1px solid var(--border);
    border-radius: 4px;
    display: block;
  }
  .images figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .stats {
    font-family: ui-monospace, monospace;
    font-size: 13px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .stats .ok { color: var(--accent); }
  .stats .bad { color: var(--bad); }
  .loading { opacity: 0.4; }
</style>
</head>
<body>
<aside>
  <h1>TERRAIN-SIM TUNER</h1>
  <div class="sim-tabs" id="simTabs"></div>
  <button id="resetBtn" class="reset-btn">Reset to defaults</button>
  <div id="sharedFields"></div>
  <div id="simFields"></div>
</aside>
<main>
  <div class="images">
    <figure><img id="beforeImg" alt="before"><figcaption>before</figcaption></figure>
    <figure><img id="afterImg" alt="after"><figcaption>after</figcaption></figure>
  </div>
  <div class="stats" id="stats"></div>
</main>

<script>
let manifest = null;
let currentSim = "droplet";
let debounceTimer = null;

async function loadManifest() {
  const res = await fetch("/manifest");
  manifest = await res.json();
  buildTabs();
  buildFields();
  render();
  document.getElementById("resetBtn").onclick = resetToDefaults;
}

function resetToDefaults() {
  document.querySelectorAll("aside input[type=range]").forEach(input => {
    input.value = input.dataset.default;
    input.previousElementSibling.querySelector("output").textContent = input.value;
  });
  render();
}

function buildTabs() {
  const tabs = document.getElementById("simTabs");
  tabs.innerHTML = "";
  for (const sim of Object.keys(manifest.sims)) {
    const btn = document.createElement("button");
    btn.textContent = sim;
    btn.className = sim === currentSim ? "active" : "";
    btn.onclick = () => { currentSim = sim; buildTabs(); buildFields(); render(); };
    tabs.appendChild(btn);
  }
}

function makeField(spec, container) {
  const field = document.createElement("div");
  field.className = "field" + (container.id === "sharedFields" ? " shared" : "");
  const label = document.createElement("label");
  const span = document.createElement("span");
  span.textContent = spec.label;
  const out = document.createElement("output");
  out.textContent = spec.default;
  label.append(span, out);

  const input = document.createElement("input");
  input.type = "range";
  input.min = spec.min;
  input.max = spec.max;
  input.step = spec.step;
  input.value = spec.default;
  input.dataset.name = spec.name;
  input.dataset.default = spec.default;
  input.oninput = () => { out.textContent = input.value; scheduleRender(); };

  field.append(label, input);
  container.appendChild(field);
}

function buildFields() {
  const sharedContainer = document.getElementById("sharedFields");
  sharedContainer.innerHTML = "";
  for (const spec of manifest.shared) makeField(spec, sharedContainer);

  const simContainer = document.getElementById("simFields");
  simContainer.innerHTML = "";
  for (const spec of manifest.sims[currentSim]) makeField(spec, simContainer);
}

function scheduleRender() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(render, 150);
}

async function render() {
  const params = new URLSearchParams();
  params.set("sim", currentSim);
  document.querySelectorAll("aside input[type=range]").forEach(input => {
    params.set(input.dataset.name, input.value);
  });

  document.getElementById("beforeImg").classList.add("loading");
  document.getElementById("afterImg").classList.add("loading");

  const res = await fetch("/render?" + params.toString());
  const data = await res.json();

  if (data.error) {
    document.getElementById("stats").innerHTML = `<span class="bad">${data.error}</span>`;
    return;
  }

  document.getElementById("beforeImg").src = data.before;
  document.getElementById("afterImg").src = data.after;
  document.getElementById("beforeImg").classList.remove("loading");
  document.getElementById("afterImg").classList.remove("loading");

  const s = data.stats;
  const okClass = s.ok ? "ok" : "bad";
  document.getElementById("stats").innerHTML = `
    <span>initial=${s.initial.toFixed(4)}</span>
    <span>final=${s.final.toFixed(4)}</span>
    <span>carried=${s.carried.toFixed(4)}</span>
    <span class="${okClass}">relDiff=${s.relDiff.toExponential(3)} ${s.ok ? "OK" : "MISMATCH"}</span>
  `;
}

loadManifest();
</script>
</body>
</html>
